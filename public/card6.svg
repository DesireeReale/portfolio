<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow6" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="600" height="500" fill="url(#bg6)"/>
  <rect width="600" height="500" fill="url(#glow6)"/>

  <!-- title -->
  <text x="36" y="58" fill="#f8fafc" font-size="30" font-weight="800" letter-spacing="1">AI COMMAND</text>
  <text x="36" y="92" fill="#38bdf8" font-size="30" font-weight="800" letter-spacing="3">CENTER</text>

  <!-- constellation: central hub + project nodes -->
  <g transform="translate(300,300)">
    <!-- links -->
    <g stroke="#1e3a52" stroke-width="1.5">
      <line x1="0" y1="0" x2="-150" y2="-70"/>
      <line x1="0" y1="0" x2="150" y2="-60"/>
      <line x1="0" y1="0" x2="-170" y2="40"/>
      <line x1="0" y1="0" x2="165" y2="55"/>
      <line x1="0" y1="0" x2="-70" y2="120"/>
      <line x1="0" y1="0" x2="90" y2="115"/>
    </g>
    <!-- glowing active links -->
    <g stroke="#38bdf8" stroke-width="2" filter="url(#blur6)" opacity="0.8">
      <line x1="0" y1="0" x2="150" y2="-60"/>
      <line x1="0" y1="0" x2="-70" y2="120"/>
    </g>

    <!-- project nodes -->
    <g fill="#0f172a" stroke="#334155">
      <circle cx="-150" cy="-70" r="16"/>
      <circle cx="150" cy="-60" r="16"/>
      <circle cx="-170" cy="40" r="16"/>
      <circle cx="165" cy="55" r="16"/>
      <circle cx="-70" cy="120" r="16"/>
      <circle cx="90" cy="115" r="16"/>
    </g>
    <g fill="none">
      <circle cx="150" cy="-60" r="16" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="-70" cy="120" r="16" stroke="#34d399" stroke-width="2"/>
    </g>
    <circle cx="150" cy="-60" r="4" fill="#38bdf8"/>
    <circle cx="-70" cy="120" r="4" fill="#34d399"/>
    <circle cx="-150" cy="-70" r="3.5" fill="#64748b"/>
    <circle cx="-170" cy="40" r="3.5" fill="#64748b"/>
    <circle cx="165" cy="55" r="3.5" fill="#64748b"/>
    <circle cx="90" cy="115" r="3.5" fill="#64748b"/>

    <!-- central hub -->
    <circle r="40" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <circle r="40" fill="url(#glow6)"/>
    <circle r="6" fill="#7dd3fc"/>
    <circle r="22" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="70" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="monospace" letter-spacing="2">HUB</text>
  </g>

  <!-- capability chips -->
  <g font-size="12" font-family="monospace" font-weight="700" letter-spacing="1">
    <g transform="translate(40,150)">
      <rect width="92" height="26" rx="13" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="46" y="17" text-anchor="middle" fill="#7dd3fc">MCP TOOLS</text>
    </g>
    <g transform="translate(468,150)">
      <rect width="94" height="26" rx="13" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.4"/>
      <text x="47" y="17" text-anchor="middle" fill="#6ee7b7">LOCAL LLM</text>
    </g>
  </g>

  <!-- caption -->
  <text x="40" y="452" fill="#64748b" font-size="13" font-family="monospace" letter-spacing="1">ZERO-DEPENDENCY · PYTHON · MCP AGENT</text>
</svg>

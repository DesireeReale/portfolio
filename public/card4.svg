<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow4" cx="0.7" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="600" height="500" fill="url(#bg4)"/>
  <rect width="600" height="500" fill="url(#glow4)"/>

  <!-- title -->
  <text x="36" y="58" fill="#f8fafc" font-size="30" font-weight="800" letter-spacing="1">TENDER MONITORING</text>
  <text x="36" y="92" fill="#38bdf8" font-size="30" font-weight="800" letter-spacing="4">AI</text>

  <!-- live badge -->
  <g transform="translate(468,36)">
    <rect x="0" y="0" width="96" height="30" rx="15" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.5"/>
    <circle cx="20" cy="15" r="5" fill="#34d399"/>
    <text x="34" y="20" fill="#34d399" font-size="13" font-weight="700" letter-spacing="2">LIVE</text>
  </g>

  <!-- radar scan -->
  <g transform="translate(410,300)">
    <circle r="110" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle r="74" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle r="38" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M0 0 L95 -55 A110 110 0 0 1 108 6 Z" fill="url(#glow4)"/>
    <line x1="0" y1="0" x2="103" y2="-38" stroke="#38bdf8" stroke-width="2" filter="url(#blur4)"/>
    <line x1="0" y1="0" x2="103" y2="-38" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle cx="70" cy="-52" r="4" fill="#34d399"/>
    <circle cx="-44" cy="30" r="4" fill="#38bdf8"/>
    <circle cx="18" cy="64" r="4" fill="#38bdf8"/>
  </g>

  <!-- incoming tender docs being sorted -->
  <g transform="translate(40,150)">
    <g transform="translate(0,0)">
      <rect width="150" height="46" rx="8" fill="#0f172a" stroke="#334155"/>
      <rect x="14" y="14" width="60" height="6" rx="3" fill="#475569"/>
      <rect x="14" y="28" width="96" height="6" rx="3" fill="#334155"/>
      <rect x="122" y="15" width="16" height="16" rx="4" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8"/>
    </g>
    <g transform="translate(0,64)">
      <rect width="150" height="46" rx="8" fill="#0f172a" stroke="#334155"/>
      <rect x="14" y="14" width="72" height="6" rx="3" fill="#475569"/>
      <rect x="14" y="28" width="84" height="6" rx="3" fill="#334155"/>
      <rect x="122" y="15" width="16" height="16" rx="4" fill="#34d399" fill-opacity="0.25" stroke="#34d399"/>
    </g>
    <g transform="translate(0,128)">
      <rect width="150" height="46" rx="8" fill="#0f172a" stroke="#334155"/>
      <rect x="14" y="14" width="52" height="6" rx="3" fill="#475569"/>
      <rect x="14" y="28" width="100" height="6" rx="3" fill="#334155"/>
      <rect x="122" y="15" width="16" height="16" rx="4" fill="#a78bfa" fill-opacity="0.25" stroke="#a78bfa"/>
    </g>
    <path d="M160 87 C220 87 210 20 300 20" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- caption -->
  <text x="40" y="430" fill="#64748b" font-size="13" font-family="monospace" letter-spacing="1">SCHEDULED · AUTO-CATEGORIZED · DOCKERIZED</text>
  <text x="40" y="462" fill="#94a3b8" font-size="19" font-weight="700">Ogni giorno, senza intervento umano</text>
</svg>
